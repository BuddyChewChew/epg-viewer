<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPG Now/Next</title>
<style>
  :root{
    /* Colors sampled directly from BuddyChewChew's epg-viewer GitHub repo screenshot (dark theme) */
    --bg:#0d1117;
    --header-bg:#010409;
    --panel:#161b22;
    --line:#21262d;
    --blue:#2f81f7;
    --blue-dim:#1f6feb;
    --green:#3fb950;
    --green-dim:#2ea043;
    --text:#e6edf3;
    --text-dim:#8b949e;
    --red:#f85149;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5;}
  header{
    padding:22px 24px 18px; border-bottom:1px solid var(--line); background:var(--header-bg);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand .dot{
    width:10px;height:10px;border-radius:50%; background:var(--green);
    box-shadow:0 0 8px var(--green); display:inline-block; animation:blink 2s infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  h1{font-size:19px; margin:0; letter-spacing:-0.01em; color:var(--text); font-weight:600;}
  .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}
  .clock{font-size:14px; color:var(--text-dim); text-align:right; font-family:var(--mono);}
  .clock b{color:var(--text);}

  .controls{
    padding:16px 24px; border-bottom:1px solid var(--line);
    display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--panel);
  }
  .source-label{
    padding:7px 14px; border:1px solid var(--blue-dim); background:rgba(47,129,247,0.15); color:var(--blue);
    font-size:13px; border-radius:6px; font-weight:600; white-space:nowrap;
  }
  input[type="search"]{
    flex:1; min-width:200px; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; font-family:var(--sans); font-size:14px; border-radius:6px;
  }
  input[type="search"]::placeholder{color:var(--text-dim);}
  input[type="search"]:focus{outline:2px solid var(--blue); border-color:var(--blue);}

  .statusbar{padding:10px 24px; font-size:13px; color:var(--text-dim); border-bottom:1px solid var(--line); min-height:18px;}
  .statusbar.err{color:var(--red);}
  .statusbar.ok{color:var(--green);}

  main{padding:0;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    position:sticky; top:0; background:var(--panel); text-align:left; padding:10px 14px;
    font-size:12px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-dim);
    border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap; font-weight:600;
  }
  thead th:hover{color:var(--blue);}
  thead th.sorted{color:var(--blue);}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:hover{background:rgba(47,129,247,0.06);}
  .chid{color:var(--blue); font-size:13px; white-space:nowrap; font-family:var(--mono);}
  .ch-cell{display:flex; align-items:center; gap:10px;}
  .ch-logo{
    width:32px; height:32px; object-fit:contain; border-radius:4px;
    background:var(--bg); border:1px solid var(--line); flex-shrink:0;
  }
  .ch-logo-placeholder{
    width:32px; height:32px; border-radius:4px; background:var(--bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--text-dim); font-size:11px; font-weight:600;
  }
  .now-title{color:var(--text); font-weight:600; font-size:15px;}
  .next-title{color:var(--text-dim); font-size:15px;}
  .prog-desc{
    color:var(--text-dim); font-size:13px; margin-top:3px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    max-width:480px;
  }
  .progress-wrap{width:110px; height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px;}
  .progress-bar{height:100%; background:var(--green);}
  .time-range{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .copy-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:var(--sans);
  }
  .copy-btn:hover{color:var(--blue); border-color:var(--blue-dim); background:rgba(47,129,247,0.1);}
  .empty{padding:70px 24px; text-align:center; color:var(--text-dim); font-size:15px;}
  .empty .big{font-size:36px; color:var(--blue); margin-bottom:14px;}
  .empty code{color:var(--blue); background:var(--panel); padding:3px 8px; border-radius:4px; font-family:var(--mono); font-size:13px;}
  footer{padding:16px 24px; color:var(--text-dim); font-size:12px; border-top:1px solid var(--line);}
  footer a{color:var(--blue);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>EPG Now/Next</h1>
      <div class="sub">channel IDs + current/next programme — one source at a time, fetched by GitHub Actions</div>
    </div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="controls">
  <div class="source-label" id="sourceLabel">No source loaded</div>
  <input type="search" id="search" placeholder="filter by channel id or name…">
</div>

<div class="statusbar" id="status">Loading data/epg_data.json…</div>

<main id="main">
  <div class="empty"><div class="big">▣</div>Loading…</div>
</main>

<footer id="footer"></footer>

<script>
let data = null;
let sortState = { col: "id", dir: 1 };

function fmtClock(){
  document.getElementById('clock').innerHTML = `<b>${new Date().toLocaleTimeString()}</b> local`;
}
setInterval(fmtClock, 1000); fmtClock();

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'statusbar' + (cls ? ' '+cls : '');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadData(){
  try{
    const resp = await fetch('data/epg_data.json?t=' + Date.now(), { cache: 'no-store' });
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
    const genTime = new Date(data.generated_at);
    const src = data.source || {};
    document.getElementById('sourceLabel').textContent = src.label || 'EPG Source';
    setStatus(`Fetched ${genTime.toLocaleString()} by GitHub Actions.`, 'ok');
    render();
  } catch(e){
    setStatus(`Could not load data/epg_data.json: ${e.message}. Has the Action been run yet?`, 'err');
    console.error(e);
  }
}

function toDates(entry){
  if(!entry) return null;
  return { ...entry, start: new Date(entry.start), stop: new Date(entry.stop) };
}

function render(){
  const main = document.getElementById('main');
  const footer = document.getElementById('footer');
  if(!data || !data.source){
    main.innerHTML = `<div class="empty"><div class="big">▣</div>No data yet — run the GitHub Action with a URL.</div>`;
    footer.textContent = '';
    return;
  }
  const src = data.source;

  if(src.error){
    main.innerHTML = `<div class="empty"><div class="big">⚠</div>This source failed to load:<br><code>${escapeHtml(src.error)}</code><br><br>URL: <code>${escapeHtml(src.url)}</code></div>`;
    footer.textContent = `Source: ${escapeHtml(src.label || '')}`;
    return;
  }

  const q = document.getElementById('search').value.trim().toLowerCase();
  const channels = src.channels || {};
  let rows = [];
  Object.keys(channels).forEach(id=>{
    const ch = channels[id];
    const name = ch.name || id;
    if(q && !id.toLowerCase().includes(q) && !name.toLowerCase().includes(q)) return;
    rows.push({ id, name, logo: ch.logo || null, current: toDates(ch.current), next: toDates(ch.next) });
  });

  rows.sort((a,b)=>{
    let av, bv;
    if(sortState.col === 'id'){ av=a.id.toLowerCase(); bv=b.id.toLowerCase(); }
    else if(sortState.col === 'name'){ av=a.name.toLowerCase(); bv=b.name.toLowerCase(); }
    else if(sortState.col === 'now'){ av=a.current?a.current.title.toLowerCase():'\uffff'; bv=b.current?b.current.title.toLowerCase():'\uffff'; }
    else { av=a.id; bv=b.id; }
    return av<bv ? -1*sortState.dir : av>bv ? 1*sortState.dir : 0;
  });

  if(rows.length===0){
    main.innerHTML = `<div class="empty"><div class="big">∅</div>No channels match "${escapeHtml(q)}".</div>`;
    footer.textContent = `Source: ${escapeHtml(src.label||'')} — 0 / ${Object.keys(channels).length} channels shown.`;
    return;
  }

  const arrow = (col) => sortState.col===col ? (sortState.dir===1?' ▲':' ▼') : '';

  let html = `<table><thead><tr>
    <th></th>
    <th data-col="id" class="${sortState.col==='id'?'sorted':''}">Channel ID${arrow('id')}</th>
    <th data-col="name" class="${sortState.col==='name'?'sorted':''}">Display Name${arrow('name')}</th>
    <th data-col="now" class="${sortState.col==='now'?'sorted':''}">Now Playing${arrow('now')}</th>
    <th>Up Next</th>
    <th></th>
  </tr></thead><tbody>`;

  const now = new Date();
  rows.forEach(r=>{
    let nowCell = `<span class="next-title">—</span>`;
    if(r.current){
      const pct = Math.min(100, Math.max(0, ((now - r.current.start) / (r.current.stop - r.current.start)) * 100));
      const startStr = r.current.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const stopStr = r.current.stop.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const descHtml = r.current.desc ? `<div class="prog-desc" title="${escapeHtml(r.current.desc)}">${escapeHtml(r.current.desc)}</div>` : '';
      nowCell = `
        <div class="now-title">${escapeHtml(r.current.title)}</div>
        ${descHtml}
        <div class="time-range">${startStr} – ${stopStr}</div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct.toFixed(0)}%"></div></div>
      `;
    }
    let nextCell = `<span class="next-title">—</span>`;
    if(r.next){
      const startStr = r.next.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const nextDescHtml = r.next.desc ? `<div class="prog-desc" title="${escapeHtml(r.next.desc)}">${escapeHtml(r.next.desc)}</div>` : '';
      nextCell = `<div class="next-title">${escapeHtml(r.next.title)}</div>${nextDescHtml}<div class="time-range">${startStr}</div>`;
    }
    const initials = escapeHtml(r.name.slice(0,2).toUpperCase());
    const logoCell = r.logo
      ? `<img class="ch-logo" src="${escapeHtml(r.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;ch-logo-placeholder&quot;>${initials}</div>'">`
      : `<div class="ch-logo-placeholder">${initials}</div>`;
    html += `<tr>
      <td>${logoCell}</td>
      <td class="chid">${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${nowCell}</td>
      <td>${nextCell}</td>
      <td><button class="copy-btn" data-copy="${escapeHtml(r.id)}">copy id</button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  main.innerHTML = html;

  main.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.onclick = ()=>{
      navigator.clipboard.writeText(btn.dataset.copy);
      const orig = btn.textContent;
      btn.textContent = 'copied!';
      setTimeout(()=>btn.textContent = orig, 900);
    };
  });

  main.querySelectorAll('thead th[data-col]').forEach(th=>{
    th.onclick = ()=>{
      const col = th.dataset.col;
      if(sortState.col===col) sortState.dir *= -1;
      else { sortState.col = col; sortState.dir = 1; }
      render();
    };
  });

  footer.innerHTML = `Source: <b>${escapeHtml(src.label||'')}</b> — ${rows.length} / ${Object.keys(channels).length} channels shown. Fetched ${new Date(data.generated_at).toLocaleString()}.`;
}

document.getElementById('search').addEventListener('input', render);

loadData();
setInterval(loadData, 5 * 60 * 1000);
setInterval(render, 30 * 1000);
</script>
</body>
</html>
