<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPG Now/Next</title>
<style>
  :root{
    --bg:#0c0f0a;
    --panel:#12160f;
    --line:#243321;
    --green:#7cf26c;
    --green-dim:#3f8f3a;
    --amber:#e8b339;
    --text:#d7e3ce;
    --text-dim:#7c8a73;
    --red:#e0584a;
    --mono: "IBM Plex Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.4;}
  header{
    padding:18px 20px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .dot{
    width:8px;height:8px;border-radius:50%; background:var(--green);
    box-shadow:0 0 8px var(--green); display:inline-block; animation:blink 2s infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  h1{font-size:15px; margin:0; letter-spacing:0.08em; text-transform:uppercase; color:var(--green); font-weight:600;}
  .sub{color:var(--text-dim); font-size:11px;}
  .clock{font-size:12px; color:var(--text-dim); text-align:right;}
  .clock b{color:var(--text);}

  .controls{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel);
  }
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    padding:6px 12px; border:1px solid var(--line); background:transparent; color:var(--text-dim);
    cursor:pointer; font-family:var(--mono); font-size:12px; border-radius:3px; white-space:nowrap;
  }
  .tab.active{color:var(--bg); background:var(--green); border-color:var(--green); font-weight:600;}
  .tab.haserror{border-color:var(--red); color:var(--red);}
  .tab .cnt{opacity:.7; font-size:10px;}

  input[type="search"]{
    flex:1; min-width:180px; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:7px 10px; font-family:var(--mono); font-size:12px; border-radius:3px;
  }
  input[type="search"]::placeholder{color:var(--text-dim);}
  input[type="search"]:focus{outline:1px solid var(--green); border-color:var(--green);}

  .statusbar{padding:8px 20px; font-size:11px; color:var(--text-dim); border-bottom:1px solid var(--line); min-height:16px;}
  .statusbar.err{color:var(--red);}
  .statusbar.ok{color:var(--green-dim);}

  main{padding:0;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    position:sticky; top:0; background:var(--panel); text-align:left; padding:8px 12px;
    font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);
    border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th:hover{color:var(--green);}
  thead th.sorted{color:var(--green);}
  tbody td{padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:hover{background:rgba(124,242,108,0.04);}
  .chid{color:var(--amber); font-size:11px; white-space:nowrap;}
  .now-title{color:var(--text); font-weight:600;}
  .next-title{color:var(--text-dim);}
  .progress-wrap{width:100px; height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:4px;}
  .progress-bar{height:100%; background:var(--green);}
  .time-range{font-size:10px; color:var(--text-dim);}
  .copy-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    font-size:10px; padding:2px 6px; border-radius:3px; cursor:pointer; font-family:var(--mono);
  }
  .copy-btn:hover{color:var(--green); border-color:var(--green-dim);}
  .empty{padding:60px 20px; text-align:center; color:var(--text-dim);}
  .empty .big{font-size:32px; color:var(--green-dim); margin-bottom:10px;}
  .empty code{color:var(--amber); background:var(--panel); padding:2px 6px; border-radius:3px;}
  footer{padding:14px 20px; color:var(--text-dim); font-size:10px; border-top:1px solid var(--line);}
  footer a{color:var(--green-dim);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>EPG Now/Next</h1>
      <div class="sub">channel IDs + current/next programme, refreshed by GitHub Actions</div>
    </div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="controls">
  <div class="tabs" id="tabs"></div>
  <input type="search" id="search" placeholder="filter by channel id or name…">
</div>

<div class="statusbar" id="status">Loading data/epg_data.json…</div>

<main id="main">
  <div class="empty"><div class="big">▣</div>Loading…</div>
</main>

<footer id="footer"></footer>

<script>
let data = null;          // parsed epg_data.json
let activeKey = null;
let sortState = { col: "id", dir: 1 };

function fmtClock(){
  document.getElementById('clock').innerHTML = `<b>${new Date().toLocaleTimeString()}</b> local`;
}
setInterval(fmtClock, 1000); fmtClock();

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'statusbar' + (cls ? ' '+cls : '');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadData(){
  try{
    // cache-bust so a stale browser cache never hides a fresh commit
    const resp = await fetch('data/epg_data.json?t=' + Date.now(), { cache: 'no-store' });
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
    if(!activeKey && data.sources && data.sources.length){
      activeKey = data.sources[0].key;
    }
    const genTime = new Date(data.generated_at);
    setStatus(`Data generated ${genTime.toLocaleString()} by GitHub Actions.`, 'ok');
    buildTabs();
    render();
  } catch(e){
    setStatus(`Could not load data/epg_data.json: ${e.message}. Has the Action run at least once yet?`, 'err');
    console.error(e);
  }
}

function buildTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = "";
  if(!data || !data.sources) return;
  data.sources.forEach(s=>{
    const btn = document.createElement('button');
    const hasErr = !!s.error;
    btn.className = 'tab' + (s.key===activeKey ? ' active' : '') + (hasErr ? ' haserror' : '');
    const cnt = Object.keys(s.channels || {}).length;
    btn.innerHTML = `${escapeHtml(s.label)} <span class="cnt">${hasErr ? '(error)' : `(${cnt})`}</span>`;
    btn.onclick = () => { activeKey = s.key; buildTabs(); render(); };
    wrap.appendChild(btn);
  });
}

function nowNext(list){
  const now = new Date();
  let current = null, next = null;
  for(let i=0;i<list.length;i++){
    const p = list[i];
    const start = new Date(p.start), stop = new Date(p.stop);
    if(start <= now && now < stop){ current = {...p, start, stop}; const n = list[i+1]; next = n ? {...n, start:new Date(n.start), stop:new Date(n.stop)} : null; break; }
    if(start > now){ next = {...p, start, stop}; break; }
  }
  return { current, next };
}

function render(){
  const main = document.getElementById('main');
  const footer = document.getElementById('footer');
  if(!data || !data.sources || !data.sources.length){
    main.innerHTML = `<div class="empty"><div class="big">▣</div>No data yet — run the GitHub Action once.</div>`;
    footer.textContent = '';
    return;
  }
  const src = data.sources.find(s=>s.key===activeKey) || data.sources[0];

  if(src.error){
    main.innerHTML = `<div class="empty"><div class="big">⚠</div>This source failed to load:<br><code>${escapeHtml(src.error)}</code><br><br>URL: <code>${escapeHtml(src.url)}</code></div>`;
    footer.textContent = `Source: ${src.label}`;
    return;
  }

  const q = document.getElementById('search').value.trim().toLowerCase();
  const channels = src.channels || {};
  const programmes = src.programmes || {};
  let rows = [];
  Object.keys(channels).forEach(id=>{
    const name = channels[id];
    if(q && !id.toLowerCase().includes(q) && !name.toLowerCase().includes(q)) return;
    const list = programmes[id] || [];
    const { current, next } = nowNext(list);
    rows.push({ id, name, current, next });
  });

  rows.sort((a,b)=>{
    let av, bv;
    if(sortState.col === 'id'){ av=a.id.toLowerCase(); bv=b.id.toLowerCase(); }
    else if(sortState.col === 'name'){ av=a.name.toLowerCase(); bv=b.name.toLowerCase(); }
    else if(sortState.col === 'now'){ av=a.current?a.current.title.toLowerCase():'\uffff'; bv=b.current?b.current.title.toLowerCase():'\uffff'; }
    else { av=a.id; bv=b.id; }
    return av<bv ? -1*sortState.dir : av>bv ? 1*sortState.dir : 0;
  });

  if(rows.length===0){
    main.innerHTML = `<div class="empty"><div class="big">∅</div>No channels match "${escapeHtml(q)}".</div>`;
    footer.textContent = `Source: ${src.label} — 0 / ${Object.keys(channels).length} channels shown.`;
    return;
  }

  const arrow = (col) => sortState.col===col ? (sortState.dir===1?' ▲':' ▼') : '';

  let html = `<table><thead><tr>
    <th data-col="id" class="${sortState.col==='id'?'sorted':''}">Channel ID${arrow('id')}</th>
    <th data-col="name" class="${sortState.col==='name'?'sorted':''}">Display Name${arrow('name')}</th>
    <th data-col="now" class="${sortState.col==='now'?'sorted':''}">Now Playing${arrow('now')}</th>
    <th>Up Next</th>
    <th></th>
  </tr></thead><tbody>`;

  const now = new Date();
  rows.forEach(r=>{
    let nowCell = `<span class="next-title">—</span>`;
    if(r.current){
      const pct = Math.min(100, Math.max(0, ((now - r.current.start) / (r.current.stop - r.current.start)) * 100));
      const startStr = r.current.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const stopStr = r.current.stop.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      nowCell = `
        <div class="now-title">${escapeHtml(r.current.title)}</div>
        <div class="time-range">${startStr} – ${stopStr}</div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct.toFixed(0)}%"></div></div>
      `;
    }
    let nextCell = `<span class="next-title">—</span>`;
    if(r.next){
      const startStr = r.next.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      nextCell = `<div class="next-title">${escapeHtml(r.next.title)}</div><div class="time-range">${startStr}</div>`;
    }
    html += `<tr>
      <td class="chid">${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${nowCell}</td>
      <td>${nextCell}</td>
      <td><button class="copy-btn" data-copy="${escapeHtml(r.id)}">copy id</button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  main.innerHTML = html;

  main.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.onclick = ()=>{
      navigator.clipboard.writeText(btn.dataset.copy);
      const orig = btn.textContent;
      btn.textContent = 'copied!';
      setTimeout(()=>btn.textContent = orig, 900);
    };
  });

  main.querySelectorAll('thead th[data-col]').forEach(th=>{
    th.onclick = ()=>{
      const col = th.dataset.col;
      if(sortState.col===col) sortState.dir *= -1;
      else { sortState.col = col; sortState.dir = 1; }
      render();
    };
  });

  footer.innerHTML = `Source: <b>${escapeHtml(src.label)}</b> — ${rows.length} / ${Object.keys(channels).length} channels shown. Data generated ${new Date(data.generated_at).toLocaleString()} by the GitHub Action.`;
}

document.getElementById('search').addEventListener('input', render);

loadData();
// Re-check the committed JSON periodically and re-render progress bars
setInterval(loadData, 5 * 60 * 1000);
setInterval(render, 30 * 1000);
</script>
</body>
</html>
