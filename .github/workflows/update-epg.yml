name: Fetch EPG (manual)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "XMLTV URL to fetch (.xml or .xml.gz)"
        required: true
      label:
        description: "Label to show on the page for this source"
        required: false
        default: "EPG Source"

permissions:
  contents: write

jobs:
  fetch-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and parse (now + next only, full overwrite)
        run: |
          python fetch_epg.py \
            --url "${{ github.event.inputs.url }}" \
            --label "${{ github.event.inputs.label }}" \
            --out data/epg_data.json

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/epg_data.json
          git diff --staged --quiet || git commit -m "Refresh EPG: ${{ github.event.inputs.label }} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
